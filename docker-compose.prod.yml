version: '3.8'

services:
  mysql:
    image: mysql:8.0-alpine
    container_name: gymyamjamsai_mysql_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gymyamjamsai_network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  backend:
    image: gymyamjamsai_backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: gymyamjamsai_backend_prod
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Server
      PORT: ${PORT:-5000}
      NODE_ENV: production

      # Frontend URL (for CORS)
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}

      # Database (Docker networking)
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 24h
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gymyamjamsai_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: gymyamjamsai_frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: gymyamjamsai_frontend_prod
    depends_on:
      - backend
    environment:
      # Frontend runs as static files in nginx, build-time env var
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - gymyamjamsai_network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data_prod:
    driver: local

networks:
  gymyamjamsai_network:
    driver: bridge
